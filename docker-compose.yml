services:
  app:
    build: .
    image: knowit-graphs:latest
    container_name: knowit-graphs
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ${REPO_PATH:-../../sds-solution-ei}:/mnt/repo:ro
      - index_cache:/app/.cache/index
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
        required: false

  # MCP server — exposes KnowIT-Graphs as tools to any MCP client (Cursor,
  # Claude Desktop, etc.) via HTTP+SSE at port 8765. Forwards tool calls to
  # the main `app` container over the internal docker network.
  mcp:
    build: ./mcp_server
    image: knowit-mcp:latest
    container_name: knowit-mcp
    ports:
      - "${MCP_PORT:-8765}:8765"
    environment:
      - KNOWIT_API_URL=http://app:8080
      - MCP_PORT=8765
      - AGENT_API_TOKEN=${AGENT_API_TOKEN:-}
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  # Optional local LLM. Start only with: docker compose --profile local up
  ollama:
    image: ollama/ollama:latest
    container_name: knowit-ollama
    profiles: ["local"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
  index_cache:
