# Spark defaults shared by the demo spark-master + spark-worker and used by
# spark-submit invocations from Airflow. Iceberg Hadoop-catalog pointed at
# MinIO via S3A — no REST catalog, keeps a single-node demo simple.

spark.sql.extensions                               org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg_catalog                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_catalog.type             hadoop
spark.sql.catalog.iceberg_catalog.warehouse        s3a://demo-kg/iceberg/
spark.sql.defaultCatalog                           iceberg_catalog

# MinIO (S3A) connectivity
spark.hadoop.fs.s3a.endpoint                       http://minio:9000
spark.hadoop.fs.s3a.access.key                     minio
spark.hadoop.fs.s3a.secret.key                     minio12345
spark.hadoop.fs.s3a.path.style.access              true
spark.hadoop.fs.s3a.connection.ssl.enabled         false
spark.hadoop.fs.s3a.impl                           org.apache.hadoop.fs.s3a.S3AFileSystem

# Hadoop 3.4 core parses these as integer ms; hadoop-aws 3.3 defaults them
# as "60s"/"200s" which triggers NumberFormatException. Pin to numeric ms.
spark.hadoop.fs.s3a.connection.establish.timeout   30000
spark.hadoop.fs.s3a.connection.timeout             200000
spark.hadoop.fs.s3a.connection.request.timeout     0
spark.hadoop.fs.s3a.multipart.purge.age            86400

# Match the unit-test session tuning
spark.sql.iceberg.merge-schema                     true
spark.sql.iceberg.check-ordering                   false
spark.sql.iceberg.set-all-nullable-field           true
spark.sds.iceberg.read.schema-evolution.enabled    true
spark.sds.iceberg.read.schema-evolution.conflict-strategy   DROP_EXISTING_COLUMN
spark.sql.session.timeZone                         UTC
spark.kg.mini_srdm_schema                          ei_util

# Let Ivy resolution use a writable dir when --packages is requested
spark.jars.ivy                                     /tmp/.ivy2
